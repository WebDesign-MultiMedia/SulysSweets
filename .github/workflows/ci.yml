name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax-check serverless functions
        run: for f in api/*.js api/_lib/*.js; do node --check "$f"; done
      - name: Unit tests
        run: npm test
      - run: npm run build
      - name: Check for high/critical vulnerabilities
        run: npm audit --audit-level=high --omit=dev
